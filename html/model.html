<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型检查器 + 摄像机运镜编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 运镜编辑器控制面板 */
        #editor-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(25, 25, 28, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #efefef;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            user-select: none;
            z-index: 100;
        }
        #editor-panel h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #00d2ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            background: #2c2d35;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #3d3e4a; }
        button.primary { background: #0070f3; }
        button.primary:hover { background: #0051b3; }
        button.danger { background: #d32f2f; }
        button.danger:hover { background: #9a0007; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            margin-top: 10px;
        }
        .form-row input[type="range"] {
            width: 130px;
        }

        /* 关键点列表区 */
        #point-list-header {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }
        #point-list {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .point-item {
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .point-item:hover {
            border-color: rgba(0, 210, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }
        .point-info {
            cursor: pointer;
            flex-grow: 1;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .point-info:hover span {
            color: #00d2ff;
        }
        .point-coords {
            font-size: 10px;
            color: #777;
            font-family: monospace;
        }
        /* 单独删除按钮 */
        .btn-del-single {
            background: transparent;
            color: #ff5252;
            border: none;
            width: 22px;
            height: 22px;
            padding: 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            flex-shrink: 0;
        }
        .btn-del-single:hover {
            background: rgba(255, 82, 82, 0.2);
            color: #ff1744;
        }

        /* 关键帧数据导出弹窗 */
        #export-mask {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        #export-mask.show { display: flex; }
        #export-box {
            width: min(560px, 90vw);
            background: #1c1d22;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        #export-box h4 {
            font-size: 14px;
            color: #00d2ff;
            margin-bottom: 10px;
        }
        #export-text {
            width: 100%;
            height: 280px;
            resize: none;
            background: #121316;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #d7f7ff;
            font-family: Consolas, Menlo, monospace;
            font-size: 11.5px;
            line-height: 1.55;
            padding: 10px;
            user-select: text;
            overflow: auto;
        }
        #export-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        #copy-tip {
            font-size: 11px;
            color: #4caf50;
            align-self: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #copy-tip.show { opacity: 1; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <div id="editor-panel">
        <h3>
            <span>🎥 运镜轨迹编辑器</span>
            <span id="state-tag" style="font-size:11px; color:#4caf50;">编辑中</span>
        </h3>
        <p style="font-size: 11px; color: #888; margin-bottom: 12px;">
            点击机位名可预览；点击 ✕ 可单点删除。
        </p>

        <div class="btn-group">
            <button class="primary" id="btn-add">➕ 记录当前视角</button>
            <button class="danger" id="btn-clear">清空全部</button>
        </div>

        <div class="btn-group">
            <button id="btn-play">▶ 播放运镜</button>
            <button id="btn-stop" disabled>⏹ 停止</button>
        </div>

        <div class="btn-group">
            <button id="btn-export">📤 导出关键帧数据</button>
        </div>

        <div class="form-row">
            <span>运镜总时长: <b id="duration-val">8</b>s</span>
            <input type="range" id="duration-slider" min="3" max="25" value="8" step="1">
        </div>

        <div class="form-row">
            <span>显示网格参考线</span>
            <input type="checkbox" id="grid-check" checked>
        </div>

        <div class="form-row">
            <span>循环播放</span>
            <input type="checkbox" id="loop-check">
        </div>

        <div id="point-list-header">已记录点位 (需至少2个点):</div>
        <div id="point-list"></div>
    </div>

    <!-- 关键帧数据导出弹窗 -->
    <div id="export-mask">
        <div id="export-box">
            <h4>关键帧数据（位置 xyz + 四元数 xyzw，可直接替换 DEFAULT_WAYPOINTS）</h4>
            <textarea id="export-text" readonly></textarea>
            <div id="export-actions">
                <button class="primary" id="btn-copy">📋 复制到剪贴板</button>
                <button id="btn-close-export">关闭</button>
                <span id="copy-tip">已复制 ✓</span>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // 1. 初始化场景与渲染器
        const scene = new THREE.Scene();

        // 采用 35 度长焦消除拉伸感
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // PBR 渲染必备色彩空间配置
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 2. 空间网格线 (GridHelper)
        // 大小为 20，细分 40 格，深灰微透，不抢模型注意力
        const gridHelper = new THREE.GridHelper(20, 40, 0x555555, 0x222222);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // 环境光照
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 8, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.8, 0);

        // 3. 加载带骨骼与动画的 GLB 模型
        let mixer = null;
        const loader = new GLTFLoader();
         const MODEL_URL = '../asset/model/character/diver.glb';

        loader.load(MODEL_URL, (gltf) => {
            const model = gltf.scene;
            scene.add(model);

            model.traverse((c) => {
                if (c.isMesh) {
                    c.castShadow = true;
                    c.receiveShadow = true;
                }
            });

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                mixer.clipAction(gltf.animations[0]).play();
            }
        });

        // -------------------------------------------------------------
        // 4. 运镜轨迹与航点编辑
        // -------------------------------------------------------------
        let waypoints = []; // 航点数据 [{ pos, quat, target }]
        let posCurve = null;
        let knotFractions = null; // 各航点在整条曲线上的累计弧长占比，用于姿态分段与位置严格对齐
        let squadS = [];          // Squad 插值的内部控制点四元数（C1 连续，消除跨航点角速度突变）
        let segLengths = [];      // 每段路径的弧长
        let timeline = null;      // 播放时间轴：[{type:'hold'|'seg', index, start, end}] 及 totalTime

        // 复用临时对象，避免动画循环中每帧堆分配
        const _qa = new THREE.Quaternion();
        const _qb = new THREE.Quaternion();
        const _qInv = new THREE.Quaternion();
        const _qL1 = new THREE.Quaternion();
        const _qL2 = new THREE.Quaternion();
        const _qExp = new THREE.Quaternion();
        const _shakeVec = new THREE.Vector3();
        const _shakeEuler = new THREE.Euler();
        const _shakeQuat = new THREE.Quaternion();

        // 手持摄影抖动参数（模拟人手持机的抖动，播放运镜时叠加在理想轨迹上）
        const SHAKE_POS_AMP = 0.012;    // 基础位置抖动幅度（米）
        const SHAKE_ROT_AMP = 0.0022;   // 基础角度抖动幅度（弧度，约 0.13°）
        const SHAKE_MOVE_GAIN = 1.4;    // 移动段的放大系数（速度归一化后叠加）
        const SHAKE_HOLD_SCALE = 0.35;  // 停留时保留的抖动比例（呼吸感，避免画面完全死板）
        const SHAKE_ENABLED = true;     // 总开关

        // 多频正弦叠加，构造拟真手抖噪声；返回约 [-1, 1]
        function shakeNoise(t, f1, f2, f3, ph) {
            return Math.sin(t * f1 + ph) * 0.55
                 + Math.sin(t * f2 + ph * 2.1) * 0.30
                 + Math.sin(t * f3 + ph * 3.7) * 0.15;
        }

        // 在理想位姿之上叠加手抖（每帧基于基准重算，不累积、停止后无残留）
        function applyHandheldShake(t, motionFactor) {
            if (!SHAKE_ENABLED) return;
            const posAmp = SHAKE_POS_AMP * motionFactor;
            const rotAmp = SHAKE_ROT_AMP * motionFactor;

            // 位置抖动：三个轴用互质频率，避免规律性摆动；施加在相机局部空间
            _shakeVec.set(
                shakeNoise(t, 11.3, 6.7, 3.1, 0.0),
                shakeNoise(t, 9.1, 5.3, 2.7, 1.7),
                shakeNoise(t, 12.7, 7.9, 4.3, 3.3)
            ).multiplyScalar(posAmp);
            _shakeVec.applyQuaternion(camera.quaternion);
            camera.position.add(_shakeVec);

            // 角度抖动：小幅三轴扰动，绕相机局部轴旋转
            _shakeEuler.set(
                shakeNoise(t, 8.3, 4.9, 2.3, 0.9) * rotAmp,
                shakeNoise(t, 10.9, 6.1, 3.5, 2.5) * rotAmp,
                shakeNoise(t, 7.3, 4.1, 1.9, 4.1) * rotAmp
            );
            _shakeQuat.setFromEuler(_shakeEuler);
            camera.quaternion.multiply(_shakeQuat);
        }

        // 单位四元数对数（取最短弧，w<0 时整体取反），输出 w=0
        function quatLog(q, out) {
            let w = q.w, x = q.x, y = q.y, z = q.z;
            if (w < 0) { w = -w; x = -x; y = -y; z = -z; }
            const halfTheta = Math.acos(Math.min(1, Math.max(-1, w)));
            const s = Math.sin(halfTheta);
            out.w = 0;
            if (s > 1e-6) {
                const k = halfTheta / s;
                out.x = x * k; out.y = y * k; out.z = z * k;
            } else {
                out.x = x; out.y = y; out.z = z;
            }
            return out;
        }
        // 纯虚四元数指数，返回单位四元数
        function quatExp(p, out) {
            const v = Math.sqrt(p.x * p.x + p.y * p.y + p.z * p.z);
            out.w = Math.cos(v);
            if (v > 1e-8) {
                const k = Math.sin(v) / v;
                out.x = p.x * k; out.y = p.y * k; out.z = p.z * k;
            } else {
                out.x = p.x; out.y = p.y; out.z = p.z;
            }
            return out;
        }
        let pathLine = null;
        const markerGroup = new THREE.Group();
        scene.add(markerGroup);

        let isPlaying = false;
        let playTime = 0;        // 当前播放到时间轴的秒数
        let duration = 8;
        let isLoop = false;

        // UI 绑定
        const btnAdd = document.getElementById('btn-add');
        const btnClear = document.getElementById('btn-clear');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const btnExport = document.getElementById('btn-export');
        const exportMask = document.getElementById('export-mask');
        const exportText = document.getElementById('export-text');
        const btnCopy = document.getElementById('btn-copy');
        const btnCloseExport = document.getElementById('btn-close-export');
        const copyTip = document.getElementById('copy-tip');
        const pointList = document.getElementById('point-list');
        const stateTag = document.getElementById('state-tag');
        const durationSlider = document.getElementById('duration-slider');
        const durationVal = document.getElementById('duration-val');
        const loopCheck = document.getElementById('loop-check');
        const gridCheck = document.getElementById('grid-check');

        // 网格线显隐开关
        gridCheck.addEventListener('change', (e) => {
            gridHelper.visible = e.target.checked;
        });

        durationSlider.addEventListener('input', (e) => {
            duration = parseFloat(e.target.value);
            durationVal.innerText = duration;
        });
        loopCheck.addEventListener('change', (e) => {
            isLoop = e.target.checked;
            updateCurves();
        });

        // 重新构建曲线与辅助线
        function updateCurves() {
            markerGroup.clear();
            if (pathLine) {
                scene.remove(pathLine);
                pathLine.geometry.dispose();
                pathLine = null;
            }

            if (waypoints.length < 2) {
                posCurve = null;
                knotFractions = null;
                squadS = [];
                segLengths = [];
                timeline = null;
                // 单个点依然画一个标记球
                if (waypoints.length === 1) {
                    drawMarker(waypoints[0].pos);
                }
                return;
            }

            const positions = waypoints.map(w => w.pos);

            posCurve = new THREE.CatmullRomCurve3(positions, isLoop, 'catmullrom', 0.5);

            // 计算每个航点（曲线节点）对应的累计弧长占比：
            // 位置曲线是按弧长参数化的，各段长短不一，不能用 t*i/(n-1) 均匀切姿态段，
            // 否则姿态到达航点 i 的时刻与位置到达时刻错位（表现为"都走到下一机位才转头"）。
            (function computeKnotFractions() {
                const segN = isLoop ? waypoints.length : waypoints.length - 1;
                const SAMPLES = 48;
                segLengths = new Array(segN);
                let total = 0;
                let prev = posCurve.getPoint(0);
                for (let i = 0; i < segN; i++) {
                    let len = 0;
                    for (let s = 1; s <= SAMPLES; s++) {
                        const u = (i * SAMPLES + s) / (segN * SAMPLES);
                        const p = posCurve.getPoint(u);
                        len += p.distanceTo(prev);
                        prev = p;
                    }
                    segLengths[i] = len;
                    total += len;
                }
                knotFractions = [0];
                let acc = 0;
                for (let i = 0; i < segN - 1; i++) {
                    acc += segLengths[i];
                    knotFractions.push(total > 0 ? acc / total : (i + 1) / segN);
                }
                knotFractions.push(1);
            })();

            // 计算 Squad 内部控制点 s_i = q_i · exp(-(log(q_i^-1·q_{i-1}) + log(q_i^-1·q_{i+1}))/4)
            // 使姿态轨迹在航点处 C1 连续（角速度无突变），且节点上精确等于录制四元数
            (function buildSquadControls() {
                const n = waypoints.length;
                squadS = new Array(n);
                for (let i = 0; i < n; i++) {
                    const qi = waypoints[i].quat;
                    const iPrev = isLoop ? (i - 1 + n) % n : Math.max(0, i - 1);
                    const iNext = isLoop ? (i + 1) % n : Math.min(n - 1, i + 1);
                    _qInv.copy(qi).invert();
                    quatLog(_qL1.copy(_qInv).multiply(waypoints[iPrev].quat), _qL1);
                    quatLog(_qL2.copy(_qInv).multiply(waypoints[iNext].quat), _qL2);
                    _qExp.set((-_qL1.x - _qL2.x) / 4, (-_qL1.y - _qL2.y) / 4, (-_qL1.z - _qL2.z) / 4, 0);
                    quatExp(_qExp, _qExp);
                    squadS[i] = new THREE.Quaternion().copy(qi).multiply(_qExp);
                }
            })();

            // 构建播放时间轴（秒）：
            //  · waypoints[i].hold   —— 到达该机位后停留秒数（非循环时末机位停留忽略）
            //  · waypoints[i+1].segDur —— 显式指定第 i 段移动秒数（越小越快，如"冲刺"段）
            //  · 其余自动段平分时长滑块中剩余的时间预算，按弧长比例分配，保持全程等速
            // 段内缓动按起止是否为停留点自动选择：静止起步→加速(ease-in)，停点/终点收尾→减速(ease-out)
            (function buildTimeline() {
                const n = waypoints.length;
                const segN = segLengths.length;
                const holds = [];
                for (let i = 0; i < n; i++) {
                    const h = Number(waypoints[i].hold) || 0;
                    holds.push(!isLoop && i === n - 1 ? 0 : Math.max(0, h));
                }

                const segDurs = new Array(segN);
                let explicitSum = 0;
                let autoLen = 0;
                for (let i = 0; i < segN; i++) {
                    const d = Number(waypoints[(i + 1) % n].segDur);
                    if (d > 0) {
                        segDurs[i] = d;
                        explicitSum += d;
                    } else {
                        segDurs[i] = -1;
                        autoLen += segLengths[i];
                    }
                }
                const autoBudget = Math.max(0.1, duration - explicitSum);
                const speed = autoLen > 0 ? autoLen / autoBudget : 0;
                for (let i = 0; i < segN; i++) {
                    if (segDurs[i] < 0) segDurs[i] = speed > 0 ? segLengths[i] / speed : autoBudget / segN;
                }

                const events = [];
                let cursor = 0;
                for (let i = 0; i < segN; i++) {
                    // 循环时末机位的停留要排在末段之后，这里先跳过
                    if (holds[i] > 0 && !(isLoop && i === segN - 1)) {
                        events.push({ type: 'hold', index: i, start: cursor, end: cursor + holds[i] });
                        cursor += holds[i];
                    }
                    const startHeld = holds[i] > 0;
                    const endHeld = holds[i + 1] > 0 || (!isLoop && i === segN - 1);
                    events.push({ type: 'seg', index: i, start: cursor, end: cursor + segDurs[i], startHeld, endHeld });
                    cursor += segDurs[i];
                }
                if (isLoop && holds[segN - 1] > 0) {
                    // 循环时末机位停留放在最后一段之后（接回首段）
                    events.push({ type: 'hold', index: segN - 1, start: cursor, end: cursor + holds[segN - 1] });
                    cursor += holds[segN - 1];
                }
                timeline = { events, totalTime: cursor, segDurs, holds, avgSpeed: cursor > 0 ? segLengths.reduce((a, b) => a + b, 0) / cursor : 0 };
            })();

            // 绘制红色平滑路径线
            const points = posCurve.getPoints(100);
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xff3b30, linewidth: 2 });
            pathLine = new THREE.Line(lineGeo, lineMat);
            scene.add(pathLine);

            // 标记航点小球
            waypoints.forEach(w => drawMarker(w.pos));
        }

        function drawMarker(position) {
            const markerGeo = new THREE.SphereGeometry(0.04, 16, 16);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.copy(position);
            markerGroup.add(marker);
        }

        // 渲染机位列表（含单独删除与机位预览）
        function refreshUIList() {
            pointList.innerHTML = '';
            if (waypoints.length === 0) {
                pointList.innerHTML = '<div style="color:#555;font-size:12px;padding:4px;">暂无点位</div>';
                return;
            }

            waypoints.forEach((w, idx) => {
                const item = document.createElement('div');
                item.className = 'point-item';

                // 左侧点击可将摄像机移动至该视角
                const info = document.createElement('div');
                info.className = 'point-info';
                info.title = '点击跳转预览该机位';
                info.innerHTML = `
                    <span>机位 #${idx + 1}</span>
                    <span class="point-coords">(${w.pos.x.toFixed(1)}, ${w.pos.y.toFixed(1)}, ${w.pos.z.toFixed(1)})</span>
                `;
                info.addEventListener('click', () => {
                    if (isPlaying) return;
                    camera.position.copy(w.pos);
                    // 由录制的四元数反推视线方向，结合录制半径还原与该姿态一致的注视点
                    // （默认导入机位的 w.target 是模型中心，直接 copy 会导致朝向不同步；
                    // OrbitControls 每帧按 target 重算朝向，故只能同步偏航/俯仰，侧倾仅在播放时保留）
                    const radius = w.pos.distanceTo(w.target);
                    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(w.quat);
                    controls.target.copy(w.pos).addScaledVector(fwd, radius);
                    controls.update();
                });

                // 右侧单独删除按钮
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-del-single';
                delBtn.innerHTML = '✕';
                delBtn.title = '删除此点';
                delBtn.disabled = isPlaying;
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteWaypoint(idx);
                });

                item.appendChild(info);
                item.appendChild(delBtn);
                pointList.appendChild(item);
            });
        }

        // 删除指定点
        function deleteWaypoint(index) {
            waypoints.splice(index, 1);
            updateCurves();
            refreshUIList();
        }

        // 记录视角点
        btnAdd.addEventListener('click', () => {
            waypoints.push({
                pos: camera.position.clone(),
                quat: camera.quaternion.clone(), // 记录完整姿态四元数（无奇点）
                target: controls.target.clone()
            });
            updateCurves();
            refreshUIList();
        });

        // 清空关键点
        btnClear.addEventListener('click', () => {
            stopPlayback();
            waypoints = [];
            updateCurves();
            refreshUIList();
        });

        // 播放运镜
        btnPlay.addEventListener('click', () => {
            if (waypoints.length < 2) {
                alert('请至少记录 2 个机位点后再播放！');
                return;
            }
            updateCurves();
            isPlaying = true;
            playTime = 0;
            controls.enabled = false;
            btnPlay.disabled = true;
            btnStop.disabled = false;
            btnAdd.disabled = true;
            btnClear.disabled = true;
            stateTag.innerText = '正在运镜';
            stateTag.style.color = '#ff9800';
            markerGroup.visible = false;
            if (pathLine) pathLine.visible = false;
            refreshUIList(); // 禁用删除按钮
        });

        // 停止运镜
        function stopPlayback() {
            isPlaying = false;

            // 根据当前相机的视线朝向向前延伸 3 米，更新 OrbitControls 的中心点
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            controls.target.copy(camera.position).addScaledVector(forward, 3);
            controls.update();

            controls.enabled = true;
            btnPlay.disabled = false;
            btnStop.disabled = true;
            btnAdd.disabled = false;
            btnClear.disabled = false;
            stateTag.innerText = '编辑中';
            stateTag.style.color = '#4caf50';
            markerGroup.visible = true;
            if (pathLine) pathLine.visible = true;
            refreshUIList();
        }
        btnStop.addEventListener('click', stopPlayback);

        // 数字格式化：保留 6 位小数并消除 -0
        function fmtNum(v) {
            const r = Math.round(v * 1e6) / 1e6;
            return Object.is(r, -0) ? 0 : r;
        }
        function fmtVec3(v) {
            return `[${fmtNum(v.x)}, ${fmtNum(v.y)}, ${fmtNum(v.z)}]`;
        }
        function fmtQuat(q) {
            return `[${fmtNum(q.x)}, ${fmtNum(q.y)}, ${fmtNum(q.z)}, ${fmtNum(q.w)}]`;
        }

        // 将当前全部关键帧序列化为可直接替换 DEFAULT_WAYPOINTS 的代码文本
        function serializeWaypoints() {
            const lines = waypoints.map((w) => {
                let extras = '';
                if (Number(w.hold) > 0) extras += `, hold: ${fmtNum(w.hold)}`;
                if (Number(w.segDur) > 0) extras += `, segDur: ${fmtNum(w.segDur)}`;
                return `    { pos: ${fmtVec3(w.pos)}, quat: ${fmtQuat(w.quat)}${extras} },`;
            });
            return [
                '// 共 ' + waypoints.length + ' 个关键帧（导出时间: ' + new Date().toLocaleString() + '）',
                'const DEFAULT_WAYPOINTS = [',
                lines.join('\n'),
                '];'
            ].join('\n');
        }

        function openExport() {
            if (waypoints.length === 0) {
                alert('当前没有任何航点，请先记录视角！');
                return;
            }
            const code = serializeWaypoints();
            exportText.value = code;
            console.log('==== 运镜关键帧数据（位置 xyz + 四元数 xyzw）====\n' + code);
            exportMask.classList.add('show');
        }

        function closeExport() {
            exportMask.classList.remove('show');
            copyTip.classList.remove('show');
        }

        function flashCopyTip() {
            copyTip.classList.add('show');
            setTimeout(() => copyTip.classList.remove('show'), 1500);
        }

        btnExport.addEventListener('click', openExport);
        btnCloseExport.addEventListener('click', closeExport);
        exportMask.addEventListener('click', (e) => {
            if (e.target === exportMask) closeExport();
        });
        btnCopy.addEventListener('click', async () => {
            const text = exportText.value;
            try {
                await navigator.clipboard.writeText(text);
            } catch (err) {
                // 非安全上下文（如 file://）降级方案
                exportText.focus();
                exportText.select();
                document.execCommand('copy');
            }
            flashCopyTip();
        });

        // -------------------------------------------------------------
        // 5. 渲染循环
        // -------------------------------------------------------------
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta);

            if (isPlaying && timeline) {
                playTime += delta;

                if (playTime >= timeline.totalTime) {
                    if (isLoop) {
                        playTime %= timeline.totalTime;
                    } else {
                        playTime = timeline.totalTime;
                        stopPlayback();
                    }
                }

                // 在时间轴上定位当前事件（停留 hold 或 移动 seg）
                const evs = timeline.events;
                let ev = evs[0];
                for (let i = 0; i < evs.length; i++) {
                    if (playTime < evs[i].end || i === evs.length - 1) { ev = evs[i]; break; }
                }
                const idx = ev.index;
                let motionFactor = SHAKE_HOLD_SCALE;

                if (ev.type === 'hold') {
                    // 停留：位置姿态严格锁定在该机位
                    camera.position.copy(posCurve.getPointAt(knotFractions[idx]));
                    camera.quaternion.copy(waypoints[idx].quat);
                } else {
                    const segDur = Math.max(1e-4, ev.end - ev.start);
                    const raw = Math.min(1, Math.max(0, (playTime - ev.start) / segDur));
                    // 段内缓动：静止起步用 ease-in，停点/终点收尾用 ease-out，两者兼有 smoothstep，其余匀速
                    let u;
                    if (ev.startHeld && ev.endHeld) u = raw * raw * (3 - 2 * raw);
                    else if (ev.startHeld) u = raw * raw;
                    else if (ev.endHeld) u = 1 - (1 - raw) * (1 - raw);
                    else u = raw;

                    // 1. 位置：弧长占比 = 段区间映射，保证位置与姿态在航点处同时刻到达
                    const arc = knotFractions[idx] + u * (knotFractions[idx + 1] - knotFractions[idx]);
                    camera.position.copy(posCurve.getPointAt(arc));

                    // 2. 姿态：Squad 球面四边形插值（四元数版 CatmullRom），节点精确且角速度连续
                    const p1 = waypoints[idx];
                    const p2 = waypoints[(idx + 1) % waypoints.length];
                    if (Math.abs(p1.quat.dot(p2.quat)) > 0.99999) {
                        // 相邻机位姿态相同（如直线冲刺段）：锁定朝向，避免 Squad 控制点造成多余摆动
                        camera.quaternion.copy(p1.quat);
                    } else {
                        const s1 = squadS[idx];
                        const s2 = squadS[(idx + 1) % squadS.length];
                        _qa.slerpQuaternions(p1.quat, p2.quat, u);
                        _qb.slerpQuaternions(s1, s2, u);
                        camera.quaternion.slerpQuaternions(_qa, _qb, 2 * u * (1 - u));
                    }

                    // 该段速度归一化：越快抖动越明显（冲刺段比匀速段更"晃"）
                    const segSpeed = segLengths[idx] / segDur;
                    const ratio = timeline.avgSpeed > 0 ? Math.min(1, segSpeed / timeline.avgSpeed) : 1;
                    motionFactor = SHAKE_HOLD_SCALE + SHAKE_MOVE_GAIN * ratio;
                }

                // 3. 在理想位姿上叠加手持抖动（每帧重算，不累积）
                applyHandheldShake(playTime, motionFactor);
            } else {
                controls.update();
            }

            renderer.render(scene, camera);
        }
        animate();

        window.__rig = { camera, get waypoints() { return waypoints; }, get knots() { return knotFractions; }, get timeline() { return timeline; }, get posCurve() { return posCurve; } };

        // 默认运镜队列：页面加载即预置；pos 为位置 xyz，quat 为姿态四元数 xyzw，
        // quat 为 null 时自动看向模型中心。点击「导出关键帧数据」生成的内容可直接整体替换此数组。
// 共 5 个关键帧（导出时间: 2026/10/12 09:02:04）
// 可选字段：hold=到达该机位后停留秒数；segDur=进入该机位的这一段移动秒数（越小越快）
const DEFAULT_WAYPOINTS = [
    { pos: [0.045908, 2.161719, 1.597315], quat: [-0.113407, 0.700901, 0.694831, 0.114397] },
    { pos: [0.196714, 0.751894, -1.493803], quat: [0.000889, 0.993984, 0.109222, -0.008094] },
    { pos: [-0.156631, 0.721736, -9.35683], quat: [0.001418, 0.998043, 0.057471, -0.024621] },
    { pos: [-9.46432, 0.560821, -14.618119], quat: [-0.016972, 0.97839, -0.089447, -0.185643], hold: 2 },
    { pos: [-3.489691, 3.597148, 0.778449], quat: [-0.016972, 0.97839, -0.089447, -0.185643], segDur: 1.5 },
];
        (function initDefaultWaypoints() {
            const lookTarget = controls.target.clone();
            const tmpCam = new THREE.PerspectiveCamera();
            DEFAULT_WAYPOINTS.forEach((d) => {
                const pos = new THREE.Vector3(d.pos[0], d.pos[1], d.pos[2]);
                let quat;
                if (d.quat) {
                    quat = new THREE.Quaternion(d.quat[0], d.quat[1], d.quat[2], d.quat[3]);
                } else {
                    tmpCam.position.copy(pos);
                    tmpCam.lookAt(lookTarget);
                    quat = tmpCam.quaternion.clone();
                }
                const wp = { pos, quat, target: lookTarget.clone() };
                if (Number(d.hold) > 0) wp.hold = Number(d.hold);
                if (Number(d.segDur) > 0) wp.segDur = Number(d.segDur);
                waypoints.push(wp);
            });
            updateCurves();
        })();

        refreshUIList();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
